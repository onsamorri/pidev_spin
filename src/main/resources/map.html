<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Selection</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    var map = L.map('map').setView([36.8065, 10.1815], 6); // Default view (Tunisia)

    // Load OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker;
    var javaConnector = null; // Global variable to store JavaConnector

    // Function to reconnect JavaConnector
    function reconnectJavaConnector() {
        if (window.javaConnector) {
            javaConnector = window.javaConnector; // Store the JavaConnector object
            console.log("JavaConnector reconnected.");
        } else {
            console.error("JavaConnector is not available.");
        }
    }

    // Function to search for a location by name
    function searchLocation(locationName) {
        fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locationName)}&format=json`)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    var lat = parseFloat(data[0].lat);
                    var lon = parseFloat(data[0].lon);
                    var displayName = data[0].display_name;

                    // Update the map view
                    map.setView([lat, lon], 13);

                    // Remove the previous marker if exists
                    if (marker) {
                        map.removeLayer(marker);
                    }

                    // Add new marker at the searched location
                    marker = L.marker([lat, lon]).addTo(map)
                        .bindPopup("Searched Location: " + displayName)
                        .openPopup();

                    // Send the coordinates to JavaFX WebView
                    if (javaConnector) {
                        javaConnector.sendLocation(lat + ", " + lon);
                    } else {
                        console.error("JavaConnector is not defined!");
                    }
                } else {
                    // Send an error message to JavaFX
                    if (javaConnector) {
                        javaConnector.sendLocation("Error: Location not found!");
                    } else {
                        console.error("JavaConnector is not defined!");
                    }
                }
            })
            .catch(error => {
                // Send an error message to JavaFX
                if (javaConnector) {
                    javaConnector.sendLocation("Error: Failed to search location!");
                } else {
                    console.error("JavaConnector is not defined!");
                }
            });
    }

    // Click event to select a location
    map.on('click', function (e) {
        var lat = e.latlng.lat.toFixed(6);
        var lng = e.latlng.lng.toFixed(6);

        // Remove the previous marker if exists
        if (marker) {
            map.removeLayer(marker);
        }

        // Add new marker at the clicked position
        marker = L.marker([lat, lng]).addTo(map)
            .bindPopup("Selected Location: " + lat + ", " + lng)
            .openPopup();

        // Send the coordinates to JavaFX WebView
        if (javaConnector) {
            javaConnector.sendLocation(lat + ", " + lng);
        } else {
            console.error("JavaConnector is not defined!");
        }

        // Reconnect JavaConnector after every click
        reconnectJavaConnector();
    });

    // Reconnect JavaConnector on map zoom or move
    map.on('zoomend', reconnectJavaConnector); // Call when zooming ends
    map.on('moveend', reconnectJavaConnector); // Call when moving ends
</script>
</body>
</html>
